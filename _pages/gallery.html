---
layout: archive
title: "Gallery"
permalink: /gallery/
author_profile: true
---

<div class="gallery-masonry" id="gallery-masonry">

  {% for item in site.data.gallery %}
  <figure
    class="gallery-item"
    data-index="{{ forloop.index0 }}"
    data-title="{{ item.title | escape }}"
    data-description="{{ item.description | escape }}"
    data-location="{{ item.location | escape }}"
    data-date="{{ item.date | escape }}"
    data-image="{{ item.image | relative_url }}"
  >

    <img
      src="{{ item.image | relative_url }}"
      alt="{{ item.title | escape }}"
      loading="lazy"
    >

    <figcaption class="gallery-caption">
      <div class="gallery-caption-inner">
        <h2>{{ item.title }}</h2>

        {% if item.description %}
        <p class="gallery-description">
          {{ item.description }}
        </p>
        {% endif %}

        <div class="gallery-meta">
          {% if item.location %}
          <span>{{ item.location }}</span>
          {% endif %}

          {% if item.date %}
          <span>{{ item.date }}</span>
          {% endif %}
        </div>
      </div>
    </figcaption>

  </figure>
  {% endfor %}

</div>


<!-- Lightbox -->
<div
  class="gallery-lightbox"
  id="gallery-lightbox"
  aria-hidden="true"
>

  <button
    class="gallery-lightbox-close"
    id="gallery-lightbox-close"
    aria-label="Close gallery image"
  >
    &times;
  </button>

  <button
    class="gallery-lightbox-nav gallery-lightbox-prev"
    id="gallery-lightbox-prev"
    aria-label="Previous image"
  >
    &#10094;
  </button>

  <div class="gallery-lightbox-content">

    <img
      id="gallery-lightbox-image"
      src=""
      alt=""
    >

    <div class="gallery-lightbox-info">

      <h2 id="gallery-lightbox-title"></h2>

      <p id="gallery-lightbox-description"></p>

      <div class="gallery-lightbox-meta">
        <span id="gallery-lightbox-location"></span>
        <span id="gallery-lightbox-date"></span>
      </div>

    </div>

  </div>

  <button
    class="gallery-lightbox-nav gallery-lightbox-next"
    id="gallery-lightbox-next"
    aria-label="Next image"
  >
    &#10095;
  </button>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

  const items = Array.from(
    document.querySelectorAll(".gallery-item")
  );

  const lightbox = document.getElementById("gallery-lightbox");
  const lightboxImage = document.getElementById("gallery-lightbox-image");
  const lightboxTitle = document.getElementById("gallery-lightbox-title");
  const lightboxDescription = document.getElementById("gallery-lightbox-description");
  const lightboxLocation = document.getElementById("gallery-lightbox-location");
  const lightboxDate = document.getElementById("gallery-lightbox-date");

  const closeButton = document.getElementById("gallery-lightbox-close");
  const prevButton = document.getElementById("gallery-lightbox-prev");
  const nextButton = document.getElementById("gallery-lightbox-next");

  let currentIndex = 0;


  function showImage(index) {

    if (index < 0) {
      index = items.length - 1;
    }

    if (index >= items.length) {
      index = 0;
    }

    currentIndex = index;

    const item = items[currentIndex];

    lightboxImage.src = item.dataset.image;
    lightboxImage.alt = item.dataset.title;

    lightboxTitle.textContent = item.dataset.title || "";
    lightboxDescription.textContent = item.dataset.description || "";
    lightboxLocation.textContent = item.dataset.location || "";
    lightboxDate.textContent = item.dataset.date || "";

    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");

    document.body.classList.add("gallery-lightbox-open");
  }


  function closeLightbox() {

    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");

    document.body.classList.remove("gallery-lightbox-open");
  }


  items.forEach((item, index) => {

    item.addEventListener("click", function () {
      showImage(index);
    });

  });


  closeButton.addEventListener("click", closeLightbox);


  prevButton.addEventListener("click", function (event) {
    event.stopPropagation();
    showImage(currentIndex - 1);
  });


  nextButton.addEventListener("click", function (event) {
    event.stopPropagation();
    showImage(currentIndex + 1);
  });


  lightbox.addEventListener("click", function (event) {

    if (event.target === lightbox) {
      closeLightbox();
    }

  });


  document.addEventListener("keydown", function (event) {

    if (!lightbox.classList.contains("is-open")) {
      return;
    }

    if (event.key === "Escape") {
      closeLightbox();
    }

    if (event.key === "ArrowLeft") {
      showImage(currentIndex - 1);
    }

    if (event.key === "ArrowRight") {
      showImage(currentIndex + 1);
    }

  });

});
</script>
